<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>NVCI · 网络厂商竞品情报工作台</title>
  <link rel="stylesheet" href="/styles.css?v=0.8.1" />
</head>
<body>
  <div id="login-screen" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">N</div>
      <p class="eyebrow">NETWORK VENDOR COMPETITIVE INTELLIGENCE</p>
      <h1>情报资料工作台</h1>
      <p class="muted">面向局域网部署的厂商资料、PDF、路径健康检查与增量更新系统。</p>
      <form id="login-form">
        <label>本地管理员密码<input id="password" type="password" autocomplete="current-password" placeholder="输入部署时配置的密码" required /></label>
        <button class="primary" type="submit">登录工作台</button>
        <p id="login-error" class="form-error"></p>
      </form>
      <p class="small muted">本系统只管理公开资料与本地归档；不会保存 NAS、厂商、GitHub 或云盘的账户密码。</p>
    </section>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-mark compact">N</div><div><strong>NVCI</strong><span>厂商情报工作台</span></div></div>
      <nav id="nav" class="nav">
        <button data-view="dashboard" class="active"><span>▦</span> 控制台</button>
        <button data-view="vendors"><span>◈</span> 厂商记忆</button>
        <button data-view="products"><span>▤</span> 产品与彩页</button>
        <button data-view="intelligence"><span>◇</span> 情报核心（试点）</button>
        <button data-view="library"><span>▧</span> 本地资料库</button>
        <button data-view="updates"><span>↻</span> 更新中心</button>
        <button data-view="runs"><span>◷</span> 任务日志</button>
        <button data-view="settings"><span>⚙</span> 设置</button>
      </nav>
      <div class="sidebar-footer"><div class="health-dot"></div><span>局域网本地服务</span><button id="logout" class="link-button">退出</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><p id="view-kicker" class="eyebrow">OVERVIEW</p><h2 id="view-title">控制台</h2></div><div class="topbar-actions"><span id="last-run" class="pill">尚未执行健康检查</span><button id="export-state" class="secondary">导出状态</button></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <template id="dashboard-template">
    <section class="hero-panel"><div><p class="eyebrow accent">LOW-COST CONTINUOUS COLLECTION</p><h3>先检查，再差异，后增量。</h3><p>路径健康检查只读取有限样本的 HTTP 元数据；只有资料 URL、资源 ID、长度、日期、ETag 或内容哈希发生变化时，才进入下载和解析队列。</p></div><button id="run-health" class="primary">运行路径健康检查</button></section>
    <section id="stats" class="stats-grid"></section>
    <section class="grid-two"><article class="panel"><div class="panel-head"><div><p class="eyebrow">VENDOR MEMORY</p><h3>厂商路径健康</h3></div><button data-goto="vendors" class="link-button">查看全部</button></div><div id="vendor-health" class="vendor-health"></div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">RECENT ACTIVITY</p><h3>最近任务</h3></div><button data-goto="runs" class="link-button">任务日志</button></div><div id="recent-runs" class="run-list"></div></article></section>
    <section class="panel"><div class="panel-head"><div><p class="eyebrow">COLLECTION GOVERNANCE</p><h3>资料状态分布</h3></div><button data-goto="products" class="link-button">审核产品状态</button></div><div id="status-bars" class="status-bars"></div></section>
  </template>

  <template id="vendors-template"><section class="panel"><div class="panel-head"><div><p class="eyebrow">SOURCE PLAYBOOK</p><h3>厂商采集记忆</h3><p class="muted">维护主证据、公开域名、下载方法、访问边界与路径健康样本。仅对小样本异常路径做方法恢复验证。</p></div></div><div id="vendor-cards" class="vendor-grid"></div></section></template>

  <template id="products-template"><section class="panel"><div class="panel-head responsive"><div><p class="eyebrow">PRODUCT & COLLATERAL STATUS</p><h3>产品与彩页状态</h3><p class="muted">“用户确认无彩页”会作为永久缺口记录保留，不再反复检索。</p></div><div class="table-tools"><input id="product-search" placeholder="搜索产品、资源 ID、URL…" /><select id="product-status"><option value="">全部状态</option><option value="pdf_acquired">已获公开 PDF</option><option value="user_confirmed_no_brochure">用户确认无彩页</option><option value="source_unavailable">资源 404</option><option value="no_resource_link">未发现资源入口</option><option value="page_access_gap">产品页访问缺口</option></select></div></div><div class="table-wrap"><table><thead><tr><th>厂商</th><th>产品线 / 分类</th><th>产品或系列</th><th>状态</th><th>资源 ID</th><th>官方链接</th><th>说明</th></tr></thead><tbody id="product-rows"></tbody></table></div></section></template>

  <template id="intelligence-template"><section class="hero-panel"><div><p class="eyebrow accent">P0-1 · READ-ONLY INTELLIGENCE CORE</p><h3>把受控资料变成可回溯的情报事实。</h3><p>当前试点仅导入 ALE OmniSwitch 已验证来源配置中的系列、Data sheet、SHA-256、资料页和证据规则。导入只写入独立 SQLite 数据库，不会改写 PDF、活动资料库、来源配置、快照或既有发布记录。</p></div><div class="automation-actions"><button id="preview-ale-import" class="secondary">预览 ALE 导入</button><button id="execute-ale-import" class="primary">执行只读导入</button><button id="export-intelligence" class="secondary">导出情报快照</button></div></section><section id="intelligence-stats" class="stats-grid"></section><section class="grid-two"><article class="panel"><div class="panel-head"><div><p class="eyebrow">IMPORT BOUNDARY</p><h3>ALE 导入状态</h3></div></div><div id="intelligence-status" class="callout muted">正在读取情报核心状态…</div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">AUDIT RUNS</p><h3>最近导入审计</h3></div></div><div id="intelligence-import-audit" class="run-list"></div></article></section><section class="grid-two"><article class="panel"><div class="panel-head"><div><p class="eyebrow">ENTITY GRAPH</p><h3>ALE OmniSwitch 系列</h3><p class="muted">点击系列可查看与官方资料和哈希基线的事实回链。</p></div></div><div class="table-wrap"><table><thead><tr><th>系列</th><th>资料状态</th><th>证据</th></tr></thead><tbody id="intelligence-series"></tbody></table></div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">FACT & EVIDENCE</p><h3>字段事实</h3></div></div><div id="intelligence-detail" class="detail-grid"><p class="muted">请选择一个 ALE OmniSwitch 系列。</p></div></article></section><section class="hero-panel governance-hero"><div><p class="eyebrow accent">P0-2 · RESEARCH GOVERNANCE</p><h3>把资料质量和人工判断纳入同一个研究闭环。</h3><p>初始化后将为 ALE OmniSwitch 建立纵向研究任务卡，并生成字段质量与资料基线审核项。审核记录仅写入 SQLite 情报核心；不会改变 PDF、来源配置或已验证采集快照。</p></div><div class="automation-actions"><button id="bootstrap-ale-governance" class="primary">初始化 ALE 治理试点</button></div></section><section id="governance-metrics" class="stats-grid"></section><section class="panel field-scope-panel"><div class="panel-head responsive"><div><p class="eyebrow">PRODUCT MANAGER FIELD SCOPE</p><h3>技术字段范围与证据门槛</h3><p class="muted">产品经理先选择研究任务和字段模板，再勾选本轮必须进入事实层的技术字段。提交只生成待批准字段包；批准后才成为字段覆盖率、受控抽取和后续对标的统一口径。</p></div><div id="field-scope-status" class="callout muted">正在读取字段范围状态…</div></div><div class="field-scope-tools"><label>研究任务<select id="field-scope-task"></select></label><label>字段模板<select id="field-scope-template"></select></label></div><div id="field-scope-template-description" class="callout muted"></div><div id="field-scope-items" class="field-scope-items"></div><label class="field-scope-rationale">范围说明与决策依据<textarea id="field-scope-rationale" maxlength="2000" placeholder="例如：本轮先支持 ALE 园区接入/汇聚交换机的定型与 Aruba CX 对标；保留未披露状态，不用推断补齐。"></textarea></label><div class="automation-actions"><button id="submit-field-scope" class="primary">提交字段范围，进入审批</button><button id="approve-field-scope" class="secondary" disabled>批准待审字段范围</button></div></section><section class="grid-two"><article class="panel"><div class="panel-head"><div><p class="eyebrow">RESEARCH TASK</p><h3>研究任务卡</h3><p class="muted">任务状态与证据覆盖决定其是否可进入纵向或横向分析，不以 PDF 数量替代决策就绪度。</p></div></div><div id="governance-tasks" class="governance-list"><p class="muted">尚未初始化研究任务。</p></div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">REVIEW QUEUE</p><h3>待复核事项</h3><p class="muted">关闭、延期或驳回必须说明理由；所有人工判断保留审计记录。</p></div></div><div id="governance-reviews" class="governance-list"><p class="muted">尚无待复核事项。</p></div></article></section></template>

  <template id="library-template"><section class="grid-two"><article class="panel"><div class="panel-head"><div><p class="eyebrow">ACTIVE LIBRARY</p><h3>活动资料库扫描</h3><p class="muted">活动目录仅用于已核验的 PDF、五列表格、manifest 和更新审计；扫描结果按当前排序规则分页展示。</p></div><button id="scan-library" class="secondary">重新扫描</button></div><div id="library-counts" class="stats-grid small-grid"></div><div id="library-path" class="library-path muted"></div></article><article class="panel"><p class="eyebrow">DATA INTAKE</p><h3>存放规则</h3><p class="muted">将已核验 PDF、`document_manifest.csv`、分类五列表格和不可变快照置于品牌/产品线目录。搜索支持文件名与完整相对路径。</p><pre class="code-block">/vol2/1000/NVCI/library/
├── 品牌产品彩页/
│   └── 产品线/01 官方彩页/
└── 品牌产品彩页/08 更新与缺口记录/</pre></article></section><section class="panel"><div class="panel-head responsive"><div><p class="eyebrow">FILES</p><h3>资料文件</h3><p id="library-result-summary" class="muted">正在读取资料库索引…</p></div><div class="table-tools library-tools"><input id="library-search" placeholder="搜索文件名或相对路径…" /><select id="library-type" aria-label="文件类型"><option value="">全部类型</option><option value="pdf">PDF</option><option value="csv">CSV</option><option value="json">JSON</option><option value="other">其他</option></select><select id="library-sort" aria-label="排序"><option value="path_asc">路径：升序</option><option value="path_desc">路径：降序</option><option value="modified_desc">修改时间：最新优先</option><option value="modified_asc">修改时间：最早优先</option><option value="size_desc">大小：由大到小</option><option value="size_asc">大小：由小到大</option><option value="type_asc">类型：升序</option></select><label class="page-size-label">每页<select id="library-page-size" aria-label="每页显示条数"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select></label></div></div><div class="table-wrap"><table><thead><tr><th class="number-col">序号</th><th>文件名</th><th>相对路径</th><th>类型</th><th>大小</th><th>修改时间</th></tr></thead><tbody id="library-rows"></tbody></table></div><div id="library-pagination" class="pagination"></div></section></template>

  <template id="updates-template"><section class="grid-two"><article class="panel"><p class="eyebrow">SAFE UPDATE GATE</p><h3>路径健康检查</h3><p class="muted">对每个厂商的一个公开入口执行 HEAD 探测，记录状态码、类型、ETag、Last-Modified、长度与耗时。不下载 PDF，不调用模型。</p><button id="run-health-2" class="primary">执行当前样本检查</button><div id="health-result" class="callout muted">尚未运行。</div></article><article class="panel"><p class="eyebrow">DECISION RULE</p><h3>更新决策</h3><div class="decision-list"><div><span class="badge good">复用</span><p>HTTP 元数据与历史基线一致；复用历史 PDF 与抽取结果。</p></div><div><span class="badge warn">下载候选</span><p>URL、资源 ID、ETag、日期、长度或哈希发生变化；仅下载变化资料。</p></div><div><span class="badge neutral">路径恢复</span><p>小样本失败时停止全量任务，以 2–5 个代表资料验证新方法。</p></div></div></article></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">NAS LOCAL AUTOMATION</p><h3>自动增量采集器</h3><p class="muted">任务在 NAS 的本地 Docker 环境执行。它只访问已登记的公开官方 HTTPS 资料，先比较 HTTP 元数据，再对候选文件计算 SHA-256；没有差异时不会重复下载 PDF。</p></div></div><div id="automation-control" class="automation-control"><p class="muted">正在读取自动采集器状态…</p></div></section></template>

  <template id="runs-template"><section class="panel"><div class="panel-head"><div><p class="eyebrow">AUDIT TRAIL</p><h3>任务日志</h3><p class="muted">记录路径检查、导入、人工确认与资料库变更，不记录密码或访问令牌。</p></div></div><div id="run-log" class="run-list large"></div></section></template>

  <template id="settings-template"><section class="grid-two"><article class="panel"><p class="eyebrow">LOCAL SECURITY</p><h3>部署安全基线</h3><ul class="check-list"><li>局域网登录密码通过环境变量提供，不写入 Git。</li><li>应用数据使用 Docker 卷持久化。</li><li>不保存 NAS、厂商、GitHub 或云盘凭据。</li><li>仅对管理员手动发起的公开路径健康样本进行网络探测。</li></ul></article><article class="panel"><p class="eyebrow">BACKUP</p><h3>导出状态</h3><p class="muted">导出厂商记忆、产品状态、文件索引、设置和运行日志，作为迁移或备份前的结构化记录。</p><button id="export-state-2" class="primary">下载 JSON 备份</button></article></section><section class="panel"><p class="eyebrow">DEPLOYMENT</p><h3>运行环境</h3><div id="setting-summary" class="detail-grid"></div></section></template>
  <script src="/app.js?v=0.8.1"></script>
</body>
</html>
